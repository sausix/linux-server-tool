# Run from the checkout root with --project-directory . and an explicit --env-file.
# Web settings and mount tables: ../frontend/README.md and README.md.
services:
  frontend:
    image: ${APPLICATION_IMAGE:-application:local}
    command: ["frontend"]
    working_dir: /frontend
    build:
      context: .
      dockerfile: docker/Dockerfile
    group_add:
      - "${BACKEND_SOCKET_GID:-2000}"
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBLISHED_BIND:-127.0.0.1}:${FRONTEND_PUBLISHED_PORT:-8000}:${FRONTEND_PORT:-8000}"
    environment:
      # All component settings; defaults match compose.env.example.
      - FRONTEND_ENV_PREFIX=${FRONTEND_ENV_PREFIX:-FRONTEND_}
      - "DOCKER_SUPPORT=${DOCKER_SUPPORT:-true}"
      - "NETWORK_SUPPORT=${NETWORK_SUPPORT:-true}"
      - "SYSTEM_SUPPORT=${SYSTEM_SUPPORT:-true}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}APP_NAME=${FRONTEND_APP_NAME:-}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}ENVIRONMENT=${FRONTEND_ENVIRONMENT:-production}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}BIND_HOST=${FRONTEND_BIND_HOST:-0.0.0.0}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}PORT=${FRONTEND_PORT:-8000}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:8000}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}DATABASE_URL=${FRONTEND_DATABASE_URL:-sqlite:////frontend/data/frontend.db}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}SECRET_KEY=${FRONTEND_SECRET_KEY:?Set FRONTEND_SECRET_KEY to a unique secret of at least 32 characters}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}SESSION_MAX_AGE_SECONDS=${FRONTEND_SESSION_MAX_AGE_SECONDS:-3600}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}SESSION_PERSISTENT=${FRONTEND_SESSION_PERSISTENT:-true}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}SESSION_ABSOLUTE_MAX_AGE_SECONDS=${FRONTEND_SESSION_ABSOLUTE_MAX_AGE_SECONDS:-43200}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_ALLOWED_NETWORKS=${FRONTEND_LOGIN_ALLOWED_NETWORKS:-[]}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_RULES=${FRONTEND_LOGIN_RULES:-[]}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}WEBAUTHN_MODE=${FRONTEND_WEBAUTHN_MODE:-optional}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_FAILURE_LIMIT=${FRONTEND_LOGIN_FAILURE_LIMIT:-5}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_IP_FAILURE_LIMIT=${FRONTEND_LOGIN_IP_FAILURE_LIMIT:-20}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_FAILURE_WINDOW_SECONDS=${FRONTEND_LOGIN_FAILURE_WINDOW_SECONDS:-900}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_BLOCK_SECONDS=${FRONTEND_LOGIN_BLOCK_SECONDS:-300}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_MAX_CONCURRENCY=${FRONTEND_LOGIN_MAX_CONCURRENCY:-4}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_IPV6_PREFIX=${FRONTEND_LOGIN_IPV6_PREFIX:-64}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}REQUEST_MAX_BYTES=${FRONTEND_REQUEST_MAX_BYTES:-8388608}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}POST_MAX_BYTES=${FRONTEND_POST_MAX_BYTES:-4194304}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}LOGIN_MAX_BYTES=${FRONTEND_LOGIN_MAX_BYTES:-16384}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}UPLOAD_MAX_BYTES=${FRONTEND_UPLOAD_MAX_BYTES:-4194304}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}UPLOAD_MAX_FILES=${FRONTEND_UPLOAD_MAX_FILES:-64}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}PASSWORD_MAX_AGE_DAYS=${FRONTEND_PASSWORD_MAX_AGE_DAYS:-90}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}HTTP_POLICY=${FRONTEND_HTTP_POLICY:-allow}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}COOKIE_SECURE=${FRONTEND_COOKIE_SECURE:-auto}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}TRUSTED_HOSTS=${FRONTEND_TRUSTED_HOSTS:-localhost,127.0.0.1}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}FORWARDED_ALLOW_IPS=${FRONTEND_FORWARDED_ALLOW_IPS:-127.0.0.1}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}SSL_CERTFILE=${FRONTEND_SSL_CERTFILE:-}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}SSL_KEYFILE=${FRONTEND_SSL_KEYFILE:-}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}DAEMON_ENDPOINT=${FRONTEND_DAEMON_ENDPOINT:-unix:///run/lsdfm/backend.sock}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}DAEMON_TOKEN=${FRONTEND_DAEMON_TOKEN:-}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}DAEMON_TIMEOUT_SECONDS=${FRONTEND_DAEMON_TIMEOUT_SECONDS:-1.0}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}DAEMON_INVENTORY_TIMEOUT_SECONDS=${FRONTEND_DAEMON_INVENTORY_TIMEOUT_SECONDS:-15.0}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}DAEMON_STORAGE_TIMEOUT_SECONDS=${FRONTEND_DAEMON_STORAGE_TIMEOUT_SECONDS:-45.0}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}DAEMON_CONTROL_TIMEOUT_SECONDS=${FRONTEND_DAEMON_CONTROL_TIMEOUT_SECONDS:-150.0}"
      - "${FRONTEND_ENV_PREFIX:-FRONTEND_}SHUTDOWN_TIMEOUT_SECONDS=${FRONTEND_SHUTDOWN_TIMEOUT_SECONDS:-10}"
    volumes:
      # Persistent accounts and per-user drafts.
      - frontend-data:/frontend/data
      # Existing daemon socket; the web service cannot replace this directory.
      - ${BACKEND_RUN_DIRECTORY:-./lsdfm-run}:/run/lsdfm:ro
    healthcheck:
      test: ["CMD", "python", "-m", "frontend.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  frontend-data:
    name: ${FRONTEND_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_frontend-data}
