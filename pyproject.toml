[project]
name = "lsdfm-workspace"
version = "0.1.0"
description = "LSDFM component workspace"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "frontend", "backend"]

[tool.uv.sources]
lsdfm-common = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "httpx>=0.28,<1",
  "websockets>=14,<18",
  "cbor2>=5.6.5,<6",
  "cryptography>=46",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
