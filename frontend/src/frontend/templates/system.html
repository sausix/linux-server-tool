{% extends 'base.html' %}
{% block title %}System control · {{ app_name }}{% endblock %}
{% block content %}
<p class="eyebrow">System control</p><h1>{{ icon('system') }}System overview</h1>
{% include 'permission.html' %}
<section id="system-view"><p id="system-status" role="status">Loading system resources…</p>
<p id="system-error" class="error" role="alert" hidden></p><div id="system-inventory"></div></section>
<script src="{{ url_for('static', path='/dom_updates.js') }}" defer></script>
<script src="{{ url_for('static', path='/system.js').include_query_params(v=static_version) }}" defer></script>
{% endblock %}
