{% extends 'base.html' %}
{% block title %}Volumes · Docker · {{ app_name }}{% endblock %}
{% block content %}
<p class="eyebrow">Docker · Volumes</p>
<h1>{{ icon('volumes') }}{{ 'Volume details' if volume_reference else 'Volumes' }}</h1>
{% include 'permission.html' %}
<section id="volumes-view" data-reference="{{ volume_reference }}" data-live="{{ 'true' if daemon_status.events else 'false' }}"
 data-write="{{ 'true' if daemon_status.docker_access in ['rw', 'readwrite'] and user.is_admin and not user.password_change_required() else 'false' }}"
 data-csrf="{{ csrf_token }}">
 <p id="volumes-status" role="status">Loading volumes…</p>
 <p id="volumes-error" class="error" role="alert" hidden></p>
 <div id="volumes-inventory"></div>
</section>
<script src="{{ url_for('static', path='/dom_updates.js') }}" defer></script>
<script src="{{ url_for('static', path='/volumes.js').include_query_params(v=static_version) }}" defer></script>
{% endblock %}
